<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Find Friends - Home</title>
</head>
<body>
    <div>
        <span>Xin chào, <b th:text="${username}"></b>!</span> |
        <a href="/logout">Đăng xuất</a>
    </div>

    <div style="margin: 12px 0;">
        <span th:if="${session.loggedInUser.premium}" style="color: green; font-weight: bold;">⭐ Tài khoản Premium</span>
        <span th:unless="${session.loggedInUser.premium}">
            Tài khoản: Thường —
            <a href="/payment" style="font-weight: bold; color: #d9534f;">Nâng cấp Premium</a>
        </span>
        <button id="btnVerifyFace" th:data-account-id="${username}" style="margin-left: 15px; padding: 6px 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Xác minh tài khoản</button>
    </div>

    <!-- Modal cho Webcam -->
    <div id="faceModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:20px; border-radius:8px; text-align:center; max-width:500px; width:90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Xác minh khuôn mặt</h3>
            <video id="videoElement" autoplay playsinline style="width:100%; border:1px solid #ddd; border-radius:4px; margin-bottom:15px; background: #000;"></video>
            <div style="display: flex; justify-content: space-between;">
                <button id="btnCloseModal" style="padding: 8px 16px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Đóng</button>
                <button id="btnStartVerify" style="padding: 8px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Xác minh ngay</button>
            </div>
            <div id="verifyMessage" style="margin-top: 10px; font-weight: bold;"></div>
        </div>
    </div>


    <div id="locationWarningBox"
         style="display:none; background:#fff3cd; color:#856404; padding:12px; border-radius:6px; margin-bottom:16px; margin-top:12px; max-width:600px;"></div>

    <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%; max-width: 700px;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Hành động</th>
                <th>Vị trí</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${otherUsers}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.userName}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <a th:href="@{/messages/{id}(id=${u.id})}"
                        style="text-decoration: none; font-weight: bold; color: blue;">💬 Nhắn tin</a>
                </td>
                <td class="location-cell" th:attr="data-user-id=${u.id}" style="color: gray;">Đang tải...</td>
            </tr>
            <tr th:if="${#lists.isEmpty(otherUsers)}">
                <td colspan="5" style="text-align: center; color: gray;">Chưa có người dùng nào khác trong DB. Hãy mở
                    tab ẩn danh đăng ký thêm 1 tài khoản khác để test nhắn tin nhé!</td>
            </tr>
        </tbody>
    </table>

    <script src="/js/home.js"></script>
</body>
</html>
