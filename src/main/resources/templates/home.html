<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Find Friends - Home</title>
</head>
<body>
    <div>
        <span data-i18n="greeting">Xin chào</span>, <b th:text="${username}"></b>! |
        <a href="/logout" data-i18n="logout">Đăng xuất</a> |
        <button type="button" id="getLocationBtn" data-i18n="getLocationBtn" onclick="checkAndRequestLocation()">📍 Lấy vị trí của tôi</button>
        <select id="langSwitcher" onchange="applyLanguage(this.value)">
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
        </select>
    </div>

    <div id="locationWarningBox"
         style="display:none; background:#fff3cd; color:#856404; padding:12px; border-radius:6px; margin-bottom:16px; margin-top:12px; max-width:600px;"></div>

    <div id="browserApprovalBox"
         style="display:none; background:#d1ecf1; color:#0c5460; padding:12px; border-radius:6px; margin-bottom:16px; max-width:600px;"></div>

    <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%; max-width: 700px;">
        <thead>
            <tr style="background-color: #f2f2f2;">
                <th data-i18n="colId">ID</th>
                <th data-i18n="colUsername">Username</th>
                <th data-i18n="colEmail">Email</th>
                <th data-i18n="colAction">Hành động</th>
                <th data-i18n="colLocation">Vị trí</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${otherUsers}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.userName}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <a th:href="@{/messages/{id}(id=${u.id})}"
                        style="text-decoration: none; font-weight: bold; color: blue;" data-i18n="message">💬 Nhắn tin</a>
                </td>
                <td class="location-cell" th:attr="data-user-id=${u.id}" style="color: gray;" data-i18n="noLocation">Chưa lấy vị trí</td>
            </tr>
            <tr th:if="${#lists.isEmpty(otherUsers)}">
                <td colspan="5" style="text-align: center; color: gray;" data-i18n="emptyList">Chưa có người dùng nào khác trong DB. Hãy mở
                    tab ẩn danh đăng ký thêm 1 tài khoản khác để test nhắn tin nhé!</td>
            </tr>
        </tbody>
    </table>

    <script src="/js/i18n.js"></script>
    <script src="/js/location.js"></script>
    <script src="/js/browser-trust.js"></script>
</body>
</html>
