<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat với <span th:text="${otherUser.userName}"></span></title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 30px auto;
        }

        .msg {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 70%;
        }

        .msg.me {
            background: #d1f0ff;
            margin-left: auto;
            text-align: right;
        }

        .msg.other {
            background: #f0f0f0;
        }

        .msg small {
            display: block;
            color: #888;
            font-size: 11px;
        }

        .error {
            color: red;
        }

        form {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        input[type=text] {
            flex: 1;
            padding: 8px;
        }
    </style>
</head>

<body>
    <div style="margin-bottom: 12px;">
        <a href="/home" style="text-decoration: none; font-weight: bold; color: #555;">⬅️ Quay lại Trang chủ</a>
    </div>

    <h2>Chat với <span th:text="${otherUser.userName}"></span> (ID: <span th:text="${otherUser.id}"></span>)</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <div id="chat-box">
        <div th:each="msg : ${conversation}" th:class="${msg.senderId == currentUser.id} ? 'msg me' : 'msg other'">
            <span th:text="${msg.content}"></span>
            <small th:text="${#temporals.format(msg.sentAt, 'HH:mm dd/MM/yyyy')}"></small>
        </div>
    </div>

    <form th:action="@{/messages/{id}(id=${otherUser.id})}" method="post">
        <input type="text" name="content" placeholder="Nhập tin nhắn..." required autofocus />
        <button type="submit">Gửi</button>
    </form>

</body>

</html>
