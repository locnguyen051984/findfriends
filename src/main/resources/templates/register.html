<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style.css">
  <title>Find Friends - Đăng ký</title>
</head>

<body>
<h1>Đăng ký tài khoản</h1>

<!-- Thông báo lỗi -->
<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>

<!-- Thông báo thành công -->
<p th:if="${successMessage}" th:text="${successMessage}" style="color: green; font-weight: bold;"></p>

<form th:action="@{/register}" method="post" th:if="${successMessage == null}">
  <div>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" th:value="${username}" required>
  </div>
  <br>
  <div>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
  </div>
  <br>
  <div>
    <label for="confirmPassword">Xác nhận Password:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" required>
  </div>
  <br>
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" th:value="${email}" required>
  </div>
  <br>
  <button type="submit">Đăng ký</button>
  <a href="/">Đã có tài khoản? Đăng nhập</a>
</form>

<!-- Nếu đăng ký thành công, tự động chuyển sang trang login sau 2 giây -->
<script th:if="${successMessage}">
  setTimeout(() => {
    window.location.href = "/";
  }, 2000);
</script>
</body>

</html>
