<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Nâng cấp Premium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { max-width: 500px; margin: 40px auto; text-align: center; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
    </style>
</head>
<body>
<a href="/home" style="position: fixed; top: 10px; left: 10px;">← Về trang chủ</a>
<h2>Nâng cấp tài khoản Premium</h2>

<div id="initialBox">
    <p>Giá: <span th:text="${price}">2000</span> VNĐ</p>
    <button id="btnCreate" onclick="createPayment()">Xử lý thanh toán</button>
</div>

<div id="paymentInfo" style="display:none;">
    <p><b>Quét mã bằng ngân hàng bạn chọn</b></p>
    <p>Thanh toán qua bất kỳ ngân hàng hoặc ví điện tử nào</p>
    <p>Giá : 2.000 VNĐ</p>

    <div id="qrcode"></div>

    <div id="status">Đang chờ thanh toán...</div>
    <button onclick="checkStatus()">Thanh toán đã hoàn tất</button>
    <br></br>

    <!--  NÚT TEST -->
    <button onclick="testMarkPaid()"> [TEST] Giả lập đã thanh toán</button>
</div>

<script>
let pollingInterval;
let currentOrderCode;

function createPayment() {
    fetch('/payment/create', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            currentOrderCode = data.orderCode;

            document.getElementById('initialBox').style.display = 'none';
            document.getElementById('paymentInfo').style.display = 'block';

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: data.qrCode,
                width: 200,
                height: 200
            });

            // Xóa title/alt để tránh lộ data khi di chuột vào QR code
            const cleanTitles = () => {
                qrContainer.removeAttribute('title');
                qrContainer.querySelectorAll('*').forEach(el => {
                    el.removeAttribute('title');
                    el.removeAttribute('alt');
                });
            };
            setTimeout(cleanTitles, 300);

            pollingInterval = setInterval(checkStatus, 3000);
        })
        .catch(err => {
            alert('Lỗi tạo thanh toán, kiểm tra console');
            console.error(err);
        });
}

function checkStatus() {
    fetch('/payment/check-status')
        .then(res => res.json())
        .then(data => {
            if (data.status === 'PAID') {
                clearInterval(pollingInterval);
                document.getElementById('status').innerText = 'Thanh toán thành công! Đang chuyển hướng...';
                setTimeout(() => window.location.href = '/home', 1500);
            } else {
                document.getElementById('status').innerText = 'Đang chờ thanh toán...';
            }
        })
        .catch(err => console.error(err));
}

function testMarkPaid() {
    fetch('/payment/test-mark-paid?orderCode=' + currentOrderCode)
        .then(() => checkStatus());
}
</script>

</body>
</html>
