<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head>
    <title>Manage Users</title>
</head>
<body>
    <div th:fragment="content">
        <h2 class="page-title">Manage Users</h2>
        
        <div class="table-container glass-panel">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.userName}">johndoe</td>
                        <td th:text="${user.email}">john@example.com</td>
                        <td>
                            <span th:if="${user.premium}" class="badge premium-badge"><i class="fa-solid fa-crown"></i> Premium</span>
                            <span th:unless="${user.premium}" class="badge standard-badge">Standard</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/users/toggle-premium}" method="post" style="display:inline;">
                                <input type="hidden" name="userId" th:value="${user.id}" />
                                <button type="submit" class="btn btn-sm btn-action">
                                    <i class="fa-solid fa-bolt"></i> Toggle Premium
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-center">No users found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
