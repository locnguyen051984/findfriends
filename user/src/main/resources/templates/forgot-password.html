<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Find Friends - Quên mật khẩu</title>
</head>

<body>
<h1>Quên mật khẩu</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>

<form th:action="@{/forgot-password}" method="post">
    <div>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" th:value="${username}" required>
    </div>
    <br>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" th:value="${email}" required>
    </div>
    <br>
    <button type="submit">Xác nhận</button>
    <a href="/">Quay lại đăng nhập</a>
</form>
</body>

</html>
