<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head>
    <title>Manage Payments</title>
</head>
<body>
    <div th:fragment="content">
        <h2 class="page-title">Manage Payments</h2>
        
        <div class="table-container glass-panel">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Order Code</th>
                        <th>User ID</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="payment : ${payments}">
                        <td th:text="${payment.id}">1</td>
                        <td th:text="${payment.orderCode}">123456</td>
                        <td th:text="${payment.userId}">1</td>
                        <td>
                            <span class="badge" th:classappend="${payment.status.name == 'SUCCESS' ? 'success-badge' : (payment.status.name == 'PENDING' ? 'pending-badge' : 'danger-badge')}" 
                                  th:text="${payment.status.name}">SUCCESS</span>
                        </td>
                        <td th:text="${#temporals.format(payment.createdAt, 'dd-MM-yyyy HH:mm')}">01-01-2026</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="5" class="text-center">No payments found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
