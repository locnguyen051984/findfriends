<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Find Friends - Đặt lại mật khẩu</title>
</head>
<body>
<h1>Đặt lại mật khẩu</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-weight: bold;"></p>
<p th:if="${successMessage}" th:text="${successMessage}" style="color: green; font-weight: bold;"></p>

<form th:action="@{/reset-password}" method="post" th:if="${successMessage == null}">
    <input type="hidden" name="username" th:value="${username}">
    <div>
        <label>Tài khoản: <b th:text="${username}"></b></label>
    </div>
    <br>
    <div>
        <label for="newPassword">Mật khẩu mới:</label>
        <input type="password" id="newPassword" name="newPassword" required>
    </div>
    <br>
    <div>
        <label for="confirmNewPassword">Xác nhận mật khẩu mới:</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required>
    </div>
    <br>
    <button type="submit">Đặt lại mật khẩu</button>
    <a href="/">Quay lại đăng nhập</a>
</form>

<script th:if="${successMessage}">
    setTimeout(() => {
        window.location.href = "/";
    }, 2000);
</script>
</body>
</html>
