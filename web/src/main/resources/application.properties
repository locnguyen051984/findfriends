spring.application.name=user
server.port=8080

 #Database Configuration (MySQL)
#spring.datasource.url=jdbc:mysql://localhost:3306/findfriends
#spring.datasource.username=root
#spring.datasource.password=2005
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/findfriends
spring.datasource.username=postgres
spring.datasource.password=2005
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# PayOS Configuration
payos.client-id=
payos.api-key=
payos.checksum-key=
payos.return-url=http://localhost:8080/payment/success
payos.cancel-url=http://localhost:8080/payment/cancel

# Force session tracking to only use cookies (disables appending ;jsessionid=... to URLs)
server.servlet.session.tracking-modes=cookie